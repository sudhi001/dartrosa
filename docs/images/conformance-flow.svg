<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">How DartRosa is checked against JavaRosa</title>
  <desc id="desc">A corpus of 401 test forms is run through two engines. Real JavaRosa 6.0.0 on the Java virtual machine (the oracle) records what it does as JSON traces, which are committed to the repository: form structure, initial values, full walks, seeded random-answer walks and dependency scenarios. DartRosa replays the same forms in the Dart tests and its results are compared with the traces; the comparison finds zero differences, including byte-identical submission XML. Continuous integration re-runs the oracle and fails if any trace changes, and runs the Dart comparison in nine time zones.</desc>
  <style>
    .bg { fill: #ffffff; }
    .text { fill: #1f2328; }
    .muted { fill: #59636e; }
    .edge { stroke: #59636e; fill: none; }
    .head { fill: #59636e; }
    .input { fill: #f6f8fa; stroke: #59636e; }
    .jvm { fill: #fff1e5; stroke: #bc4c00; }
    .dart { fill: #ddf4ff; stroke: #0969da; }
    .ok { fill: #dafbe1; stroke: #1a7f37; }
    .ci { fill: #fbefff; stroke: #8250df; }
    .lane { fill: #59636e; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .text { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .edge { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .input { fill: #161b22; stroke: #9198a1; }
      .jvm { fill: #3d1d00; stroke: #f0883e; }
      .dart { fill: #0c2d6b; stroke: #4493f8; }
      .ok { fill: #0f3d1f; stroke: #3fb950; }
      .ci { fill: #2e1a47; stroke: #ab7df8; }
      .lane { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="500" rx="8"/>
  <text class="lane" x="290" y="40" font-size="12" font-weight="700" letter-spacing="0.5">RECORD (real JavaRosa, Java 17+)</text>
  <text class="lane" x="290" y="290" font-size="12" font-weight="700" letter-spacing="0.5">REPLAY (DartRosa, dart test)</text>

  <!-- Corpus -->
  <rect class="input" x="30" y="130" width="210" height="180" rx="8" stroke-width="1.5"/>
  <text class="text" x="135" y="158" font-size="15" font-weight="600" text-anchor="middle">Test corpus</text>
  <text class="muted" x="135" y="180" font-size="12" text-anchor="middle">401 XForms in conformance/forms</text>
  <text class="muted" x="50" y="206" font-size="12">JavaRosa test forms: 65</text>
  <text class="muted" x="50" y="224" font-size="12">ODK Collect test forms: 119</text>
  <text class="muted" x="50" y="242" font-size="12">ODK Web Forms test forms: 77</text>
  <text class="muted" x="50" y="260" font-size="12">pyxform-generated: 132</text>
  <text class="muted" x="50" y="278" font-size="12">DartRosa's own: 8</text>
  <text class="muted" x="50" y="296" font-size="12">plus action scenarios</text>

  <!-- Oracle -->
  <rect class="jvm" x="290" y="52" width="220" height="100" rx="8" stroke-width="1.5"/>
  <text class="text" x="400" y="80" font-size="15" font-weight="600" text-anchor="middle">JavaRosa 6.0.0 oracle</text>
  <text class="muted" x="400" y="102" font-size="12" text-anchor="middle">conformance/jvm_oracle</text>
  <text class="muted" x="400" y="120" font-size="12" text-anchor="middle">oracle.sh batch conformance</text>
  <text class="muted" x="400" y="138" font-size="12" text-anchor="middle">parses, fills and serializes</text>

  <!-- Traces -->
  <rect class="jvm" x="560" y="52" width="210" height="160" rx="8" stroke-width="1.5"/>
  <text class="text" x="665" y="80" font-size="15" font-weight="600" text-anchor="middle">Traces (JSON)</text>
  <text class="muted" x="665" y="100" font-size="12" text-anchor="middle">conformance/traces, committed</text>
  <text class="muted" x="580" y="126" font-size="12">structure: 397 forms</text>
  <text class="muted" x="580" y="144" font-size="12">initial values: 397</text>
  <text class="muted" x="580" y="162" font-size="12">full walks: 397</text>
  <text class="muted" x="580" y="180" font-size="12">random-answer walks: 1,191</text>
  <text class="muted" x="580" y="198" font-size="12">dependency scenarios</text>

  <!-- Replay -->
  <rect class="dart" x="290" y="302" width="220" height="100" rx="8" stroke-width="1.5"/>
  <text class="text" x="400" y="330" font-size="15" font-weight="600" text-anchor="middle">DartRosa replay</text>
  <text class="muted" x="400" y="352" font-size="12" text-anchor="middle">packages/dartrosa/test/conformance</text>
  <text class="muted" x="400" y="370" font-size="12" text-anchor="middle">does the same steps</text>
  <text class="muted" x="400" y="388" font-size="12" text-anchor="middle">on the same forms</text>

  <!-- Compare -->
  <rect class="dart" x="560" y="302" width="210" height="100" rx="8" stroke-width="1.5"/>
  <text class="text" x="665" y="330" font-size="15" font-weight="600" text-anchor="middle">Compare</text>
  <text class="muted" x="665" y="352" font-size="12" text-anchor="middle">every value, label, event,</text>
  <text class="muted" x="665" y="370" font-size="12" text-anchor="middle">error and submission byte</text>
  <text class="muted" x="665" y="388" font-size="12" text-anchor="middle">(TRACE_FORMAT.md)</text>

  <!-- Result -->
  <rect class="ok" x="810" y="302" width="140" height="100" rx="8" stroke-width="1.5"/>
  <text class="text" x="880" y="340" font-size="22" font-weight="700" text-anchor="middle">0</text>
  <text class="text" x="880" y="362" font-size="13" font-weight="600" text-anchor="middle">differences</text>
  <text class="muted" x="880" y="382" font-size="11.5" text-anchor="middle">4 random-by-design</text>
  <text class="muted" x="880" y="396" font-size="11.5" text-anchor="middle">forms not traced</text>

  <!-- CI -->
  <rect class="ci" x="810" y="52" width="140" height="160" rx="8" stroke-width="1.5"/>
  <text class="text" x="880" y="80" font-size="15" font-weight="600" text-anchor="middle">CI</text>
  <text class="muted" x="880" y="104" font-size="11.5" text-anchor="middle">re-runs the oracle;</text>
  <text class="muted" x="880" y="120" font-size="11.5" text-anchor="middle">fails if a trace</text>
  <text class="muted" x="880" y="136" font-size="11.5" text-anchor="middle">changes</text>
  <text class="muted" x="880" y="164" font-size="11.5" text-anchor="middle">replays in 9</text>
  <text class="muted" x="880" y="180" font-size="11.5" text-anchor="middle">time zones, on every</text>
  <text class="muted" x="880" y="196" font-size="11.5" text-anchor="middle">push</text>

  <!-- Arrows -->
  <path class="edge" d="M 240 170 H 262 V 102 H 288" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path class="edge" d="M 240 270 H 262 V 352 H 288" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="edge" x1="510" y1="102" x2="558" y2="102" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="edge" x1="665" y1="212" x2="665" y2="300" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="edge" x1="510" y1="352" x2="558" y2="352" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="edge" x1="770" y1="352" x2="808" y2="352" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="edge" x1="770" y1="132" x2="808" y2="132" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line class="edge" x1="880" y1="212" x2="880" y2="300" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <text class="muted" x="30" y="450" font-size="12.5">The traces are the contract: a change to DartRosa that alters any recorded behaviour, including JavaRosa's quirks, fails the tests.</text>
  <text class="muted" x="30" y="470" font-size="12.5">Intentional differences (for example the regex() dialect) are listed in conformance/DEVIATIONS.md; none affects the corpus.</text>
</svg>
