<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" role="img" aria-labelledby="title desc">
  <title id="title">DartRosa package architecture</title>
  <desc id="desc">Four layers. At the bottom, the dartrosa engine package. Above it, the pure-Dart Collect-layer packages: dartrosa_calendars, dartrosa_external_data, dartrosa_entities, dartrosa_collect, dartrosa_encryption and dartrosa_openrosa. Above them, the dartrosa_flutter renderer. At the top, your app. Arrows point from a package to the packages it depends on: dartrosa_flutter depends on dartrosa, dartrosa_calendars and dartrosa_external_data; dartrosa_entities depends on dartrosa_external_data and dartrosa; dartrosa_openrosa depends on dartrosa_encryption and dartrosa; dartrosa_external_data, dartrosa_collect and dartrosa_encryption depend on dartrosa; dartrosa_calendars depends on no other DartRosa package.</desc>
  <style>
    .bg { fill: #ffffff; }
    .text { fill: #1f2328; }
    .muted { fill: #59636e; }
    .edge { stroke: #59636e; fill: none; }
    .head { fill: #59636e; }
    .core { fill: #ddf4ff; stroke: #0969da; }
    .collect { fill: #dafbe1; stroke: #1a7f37; }
    .layer { fill: none; stroke: #1a7f37; stroke-dasharray: 6 4; }
    .flutter { fill: #fbefff; stroke: #8250df; }
    .app { fill: #fff1e5; stroke: #bc4c00; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .text { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .edge { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .core { fill: #0c2d6b; stroke: #4493f8; }
      .collect { fill: #0f3d1f; stroke: #3fb950; }
      .layer { stroke: #3fb950; }
      .flutter { fill: #2e1a47; stroke: #ab7df8; }
      .app { fill: #3d1d00; stroke: #f0883e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="600" rx="8"/>

  <!-- Layer 4: the app -->
  <rect class="app" x="40" y="28" width="900" height="64" rx="8" stroke-width="1.5"/>
  <text class="text" x="490" y="56" font-size="17" font-weight="600" text-anchor="middle">Your app</text>
  <text class="muted" x="490" y="78" font-size="13" text-anchor="middle">Flutter app, server or command-line tool (packages/dartrosa_flutter/example fills the whole corpus)</text>

  <!-- Layer 3: Flutter renderer -->
  <rect class="flutter" x="40" y="150" width="500" height="64" rx="8" stroke-width="1.5"/>
  <text class="text" x="290" y="178" font-size="16" font-weight="600" text-anchor="middle">dartrosa_flutter</text>
  <text class="muted" x="290" y="199" font-size="13" text-anchor="middle">Material renderer: XFormView, pager and scroll modes (Flutter)</text>

  <!-- Layer 2: Collect layer -->
  <rect class="layer" x="108" y="252" width="852" height="128" rx="10" stroke-width="1.5"/>
  <text class="muted" x="944" y="272" font-size="12" font-weight="600" text-anchor="end">COLLECT LAYER: ports of ODK Collect features (pure Dart)</text>

  <rect class="collect" x="120" y="284" width="128" height="80" rx="8" stroke-width="1.5"/>
  <text class="text" x="184" y="314" font-size="13" font-weight="600" text-anchor="middle">calendars</text>
  <text class="muted" x="184" y="334" font-size="11.5" text-anchor="middle">Ethiopian, Persian,</text>
  <text class="muted" x="184" y="350" font-size="11.5" text-anchor="middle">… date pickers</text>

  <rect class="collect" x="260" y="284" width="128" height="80" rx="8" stroke-width="1.5"/>
  <text class="text" x="324" y="314" font-size="13" font-weight="600" text-anchor="middle">external_data</text>
  <text class="muted" x="324" y="334" font-size="11.5" text-anchor="middle">pulldata(), search()</text>
  <text class="muted" x="324" y="350" font-size="11.5" text-anchor="middle">over CSV media</text>

  <rect class="collect" x="400" y="284" width="128" height="80" rx="8" stroke-width="1.5"/>
  <text class="text" x="464" y="314" font-size="13" font-weight="600" text-anchor="middle">entities</text>
  <text class="muted" x="464" y="334" font-size="11.5" text-anchor="middle">entity forms and</text>
  <text class="muted" x="464" y="350" font-size="11.5" text-anchor="middle">offline entity lists</text>

  <rect class="collect" x="540" y="284" width="128" height="80" rx="8" stroke-width="1.5"/>
  <text class="text" x="604" y="314" font-size="13" font-weight="600" text-anchor="middle">collect</text>
  <text class="muted" x="604" y="334" font-size="11.5" text-anchor="middle">audit log, last-saved,</text>
  <text class="muted" x="604" y="350" font-size="11.5" text-anchor="middle">itemsets, edits</text>

  <rect class="collect" x="680" y="284" width="128" height="80" rx="8" stroke-width="1.5"/>
  <text class="text" x="744" y="314" font-size="13" font-weight="600" text-anchor="middle">encryption</text>
  <text class="muted" x="744" y="334" font-size="11.5" text-anchor="middle">encrypted</text>
  <text class="muted" x="744" y="350" font-size="11.5" text-anchor="middle">submissions</text>

  <rect class="collect" x="820" y="284" width="128" height="80" rx="8" stroke-width="1.5"/>
  <text class="text" x="884" y="314" font-size="13" font-weight="600" text-anchor="middle">openrosa</text>
  <text class="muted" x="884" y="334" font-size="11.5" text-anchor="middle">form list, download,</text>
  <text class="muted" x="884" y="350" font-size="11.5" text-anchor="middle">submission upload</text>

  <!-- Layer 1: engine -->
  <rect class="core" x="40" y="440" width="908" height="80" rx="8" stroke-width="1.5"/>
  <text class="text" x="494" y="470" font-size="17" font-weight="600" text-anchor="middle">dartrosa: the XForms engine (port of JavaRosa 6.0.0, pure Dart)</text>
  <text class="muted" x="494" y="494" font-size="13" text-anchor="middle">parse, XPath, recalculate, validate, navigate, serialize · session API (dartrosa.dart) · JavaRosa-compatible API (javarosa.dart)</text>

  <!-- Dependencies: app -->
  <line class="edge" x1="290" y1="92" x2="290" y2="148" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="edge" x1="744" y1="92" x2="744" y2="250" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text class="muted" x="754" y="170" font-size="12">the packages it needs</text>

  <!-- Dependencies: dartrosa_flutter -->
  <line class="edge" x1="70" y1="214" x2="70" y2="438" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="edge" x1="184" y1="214" x2="184" y2="282" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="edge" x1="324" y1="214" x2="324" y2="282" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Dependencies inside the Collect layer -->
  <line class="edge" x1="400" y1="324" x2="390" y2="324" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="edge" x1="820" y1="324" x2="810" y2="324" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Dependencies on the engine -->
  <line class="edge" x1="324" y1="364" x2="324" y2="438" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="edge" x1="464" y1="364" x2="464" y2="438" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="edge" x1="604" y1="364" x2="604" y2="438" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="edge" x1="744" y1="364" x2="744" y2="438" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="edge" x1="884" y1="364" x2="884" y2="438" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="muted" x="184" y="400" font-size="11.5" text-anchor="middle">no engine dependency</text>

  <!-- Legend -->
  <line class="edge" x1="40" y1="558" x2="80" y2="558" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="muted" x="90" y="562" font-size="12.5">depends on (runtime dependencies in each pubspec.yaml; package names without the dartrosa_ prefix in the Collect layer)</text>
  <text class="muted" x="40" y="584" font-size="12.5">Everything below dartrosa_flutter is pure Dart: no Flutter, no dart:io. It runs on the Dart VM, AOT, dart2js and dart2wasm.</text>
</svg>
