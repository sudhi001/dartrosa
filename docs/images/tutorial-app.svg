<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">The data-collection app built in the tutorial</title>
  <desc id="desc">Nine numbered steps in three rows. On a computer: step 1, design the form as an XLSForm; step 2, convert it to an XForm with ODK Central, pyxform or XLSForm Online; then ODK Central publishes it. In the Flutter app: step 3, download the form and its media with OpenRosaClient; step 4, load it with FormDefinition.parse and a ResourceResolver for the media folder; step 5, fill it in and validate it with XFormView; step 6, save a draft with saveDraft and resume it with createSession(existingInstance:), in both directions with step 5. Sending: step 7, finalize with session.finalize, which returns a Submission; step 8, encrypt it with InstanceUpload.forForm when the form has a public key; step 9, submit it with OpenRosaInstanceUploader; ODK Central then receives it and decrypts it with the project's private key.</desc>
  <style>
    .bg { fill: #ffffff; }
    .text { fill: #1f2328; }
    .muted { fill: #59636e; }
    .edge { stroke: #59636e; fill: none; }
    .head { fill: #59636e; }
    .design { fill: #fff1e5; stroke: #bc4c00; }
    .fill { fill: #ddf4ff; stroke: #0969da; }
    .send { fill: #dafbe1; stroke: #1a7f37; }
    .server { fill: #f6f8fa; stroke: #59636e; }
    .badge { fill: #59636e; }
    .badgetext { fill: #ffffff; }
    .stage { fill: #59636e; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .text { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .edge { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .design { fill: #3d1d00; stroke: #f0883e; }
      .fill { fill: #0c2d6b; stroke: #4493f8; }
      .send { fill: #0f3d1f; stroke: #3fb950; }
      .server { fill: #161b22; stroke: #9198a1; }
      .badge { fill: #9198a1; }
      .badgetext { fill: #0d1117; }
      .stage { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="500" rx="8"/>

  <!-- Row 1: design -->
  <text class="stage" x="40" y="36" font-size="13" font-weight="700" letter-spacing="0.5">ON A COMPUTER</text>
  <rect class="design" x="40" y="48" width="200" height="84" rx="8" stroke-width="1.5"/>
  <circle class="badge" cx="62" cy="70" r="11"/>
  <text class="badgetext" x="62" y="75" font-size="12" font-weight="700" text-anchor="middle">1</text>
  <text class="text" x="150" y="76" font-size="15" font-weight="600" text-anchor="middle">Design</text>
  <text class="muted" x="140" y="98" font-size="12" text-anchor="middle">an XLSForm: survey,</text>
  <text class="muted" x="140" y="115" font-size="12" text-anchor="middle">choices, settings</text>

  <rect class="design" x="280" y="48" width="200" height="84" rx="8" stroke-width="1.5"/>
  <circle class="badge" cx="302" cy="70" r="11"/>
  <text class="badgetext" x="302" y="75" font-size="12" font-weight="700" text-anchor="middle">2</text>
  <text class="text" x="390" y="76" font-size="15" font-weight="600" text-anchor="middle">Convert</text>
  <text class="muted" x="380" y="98" font-size="12" text-anchor="middle">to an XForm: ODK Central,</text>
  <text class="muted" x="380" y="115" font-size="12" text-anchor="middle">pyxform or XLSForm Online</text>

  <rect class="server" x="520" y="48" width="200" height="84" rx="8" stroke-width="1.5"/>
  <text class="text" x="620" y="76" font-size="15" font-weight="600" text-anchor="middle">ODK Central</text>
  <text class="muted" x="620" y="98" font-size="12" text-anchor="middle">publishes the form and</text>
  <text class="muted" x="620" y="115" font-size="12" text-anchor="middle">its media files</text>

  <line class="edge" x1="240" y1="90" x2="278" y2="90" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="edge" x1="480" y1="90" x2="518" y2="90" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path class="edge" d="M 620 132 V 158 H 20 V 236 H 38" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2: fill -->
  <text class="stage" x="40" y="184" font-size="13" font-weight="700" letter-spacing="0.5">IN YOUR FLUTTER APP</text>
  <rect class="fill" x="40" y="194" width="200" height="84" rx="8" stroke-width="1.5"/>
  <circle class="badge" cx="62" cy="216" r="11"/>
  <text class="badgetext" x="62" y="221" font-size="12" font-weight="700" text-anchor="middle">3</text>
  <text class="text" x="150" y="222" font-size="15" font-weight="600" text-anchor="middle">Download</text>
  <text class="muted mono" x="140" y="246" font-size="11.5" text-anchor="middle">OpenRosaClient</text>
  <text class="muted" x="140" y="263" font-size="12" text-anchor="middle">form list, XML, media</text>

  <rect class="fill" x="280" y="194" width="200" height="84" rx="8" stroke-width="1.5"/>
  <circle class="badge" cx="302" cy="216" r="11"/>
  <text class="badgetext" x="302" y="221" font-size="12" font-weight="700" text-anchor="middle">4</text>
  <text class="text" x="390" y="222" font-size="15" font-weight="600" text-anchor="middle">Load</text>
  <text class="muted mono" x="380" y="246" font-size="11.5" text-anchor="middle">FormDefinition.parse</text>
  <text class="muted" x="380" y="263" font-size="12" text-anchor="middle">+ a ResourceResolver</text>

  <rect class="fill" x="520" y="194" width="200" height="84" rx="8" stroke-width="1.5"/>
  <circle class="badge" cx="542" cy="216" r="11"/>
  <text class="badgetext" x="542" y="221" font-size="12" font-weight="700" text-anchor="middle">5</text>
  <text class="text" x="630" y="222" font-size="15" font-weight="600" text-anchor="middle">Fill and validate</text>
  <text class="muted mono" x="620" y="246" font-size="11.5" text-anchor="middle">XFormView</text>
  <text class="muted" x="620" y="263" font-size="12" text-anchor="middle">rules run as you answer</text>

  <rect class="fill" x="760" y="194" width="200" height="84" rx="8" stroke-width="1.5"/>
  <circle class="badge" cx="782" cy="216" r="11"/>
  <text class="badgetext" x="782" y="221" font-size="12" font-weight="700" text-anchor="middle">6</text>
  <text class="text" x="870" y="222" font-size="15" font-weight="600" text-anchor="middle">Save a draft</text>
  <text class="muted mono" x="860" y="246" font-size="11.5" text-anchor="middle">saveDraft()</text>
  <text class="muted" x="860" y="263" font-size="12" text-anchor="middle">resume any time</text>

  <line class="edge" x1="240" y1="236" x2="278" y2="236" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="edge" x1="480" y1="236" x2="518" y2="236" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="edge" x1="722" y1="236" x2="758" y2="236" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="edge" d="M 620 278 V 304 H 20 V 382 H 38" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 3: send -->
  <text class="stage" x="40" y="330" font-size="13" font-weight="700" letter-spacing="0.5">SEND IT</text>
  <rect class="send" x="40" y="340" width="200" height="84" rx="8" stroke-width="1.5"/>
  <circle class="badge" cx="62" cy="362" r="11"/>
  <text class="badgetext" x="62" y="367" font-size="12" font-weight="700" text-anchor="middle">7</text>
  <text class="text" x="150" y="368" font-size="15" font-weight="600" text-anchor="middle">Finalize</text>
  <text class="muted mono" x="140" y="392" font-size="11.5" text-anchor="middle">session.finalize()</text>
  <text class="muted" x="140" y="409" font-size="12" text-anchor="middle">a Submission, or the error</text>

  <rect class="send" x="280" y="340" width="200" height="84" rx="8" stroke-width="1.5"/>
  <circle class="badge" cx="302" cy="362" r="11"/>
  <text class="badgetext" x="302" y="367" font-size="12" font-weight="700" text-anchor="middle">8</text>
  <text class="text" x="390" y="368" font-size="15" font-weight="600" text-anchor="middle">Encrypt</text>
  <text class="muted mono" x="380" y="392" font-size="11.5" text-anchor="middle">InstanceUpload.forForm</text>
  <text class="muted" x="380" y="409" font-size="12" text-anchor="middle">when the form has a key</text>

  <rect class="send" x="520" y="340" width="200" height="84" rx="8" stroke-width="1.5"/>
  <circle class="badge" cx="542" cy="362" r="11"/>
  <text class="badgetext" x="542" y="367" font-size="12" font-weight="700" text-anchor="middle">9</text>
  <text class="text" x="630" y="368" font-size="15" font-weight="600" text-anchor="middle">Submit</text>
  <text class="muted mono" x="620" y="392" font-size="11.5" text-anchor="middle">OpenRosaInstanceUploader</text>
  <text class="muted" x="620" y="409" font-size="12" text-anchor="middle">retry until it succeeds</text>

  <rect class="server" x="760" y="340" width="200" height="84" rx="8" stroke-width="1.5"/>
  <text class="text" x="860" y="368" font-size="15" font-weight="600" text-anchor="middle">ODK Central</text>
  <text class="muted" x="860" y="392" font-size="12" text-anchor="middle">receives and decrypts</text>
  <text class="muted" x="860" y="409" font-size="12" text-anchor="middle">with the private key</text>

  <line class="edge" x1="240" y1="382" x2="278" y2="382" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="edge" x1="480" y1="382" x2="518" y2="382" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="edge" x1="720" y1="382" x2="758" y2="382" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text class="muted" x="40" y="464" font-size="12.5">Steps 1 and 2 need no code. Steps 3 to 9 are sections of the tutorial; the packages are dartrosa_openrosa</text>
  <text class="muted" x="40" y="482" font-size="12.5">(steps 3, 8, 9), dartrosa (4, 6, 7) and dartrosa_flutter (5). Everything works offline except steps 3 and 9.</text>
</svg>
