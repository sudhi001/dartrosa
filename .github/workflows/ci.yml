name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    name: Dart (analyze, test on VM / JS / Wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart run tool/check_core_purity.dart
      - name: Test (VM, several time zones)
        run: |
          for tz in UTC America/New_York Asia/Kolkata Europe/London Etc/GMT-2 Etc/GMT-3 Pacific/Chatham Europe/Warsaw Europe/Kiev; do
            echo "TZ=$tz"; TZ=$tz dart test packages/dartrosa
          done
      - name: Test Collect-layer packages (VM, two time zones)
        run: |
          for tz in UTC America/New_York; do
            for p in dartrosa_encryption dartrosa_entities dartrosa_external_data dartrosa_openrosa dartrosa_collect dartrosa_calendars; do
              echo "TZ=$tz $p"; TZ=$tz dart test packages/$p
            done
          done
      - name: Coverage (at least 90% of lines)
        run: |
          (cd packages/dartrosa && TZ=UTC dart test --coverage=coverage)
          dart pub global activate coverage
          (cd packages/dartrosa && dart pub global run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --package=. --report-on=lib)
          dart run tool/check_coverage.dart packages/dartrosa/coverage/lcov.info 90
      # Browser tests must run from inside each package (test runner limitation).
      - name: Test (Chrome, dart2js and dart2wasm)
        run: |
          for p in dartrosa dartrosa_encryption dartrosa_entities dartrosa_external_data dartrosa_openrosa dartrosa_collect dartrosa_calendars; do
            (cd packages/$p && dart test -p chrome && dart test -p chrome --compiler dart2wasm)
          done

  flutter:
    name: Flutter renderer (analyze, widget tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze and test dartrosa_flutter
        working-directory: packages/dartrosa_flutter
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          # Goldens are rendered on macOS (see test/golden_test.dart).
          flutter test --exclude-tags golden
      - name: Analyze the example
        working-directory: packages/dartrosa_flutter/example
        run: |
          flutter pub get
          flutter analyze --fatal-infos

  oracle:
    name: JavaRosa oracle traces are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: conformance/jvm_oracle/lib
          key: oracle-deps-${{ hashFiles('conformance/jvm_oracle/deps.txt') }}
      - run: conformance/jvm_oracle/oracle.sh batch conformance
      - name: Committed traces must match a fresh oracle run
        run: git diff --exit-code -- conformance/traces
