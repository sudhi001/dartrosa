name: Bug report
description: Something behaves differently from JavaRosa / ODK Collect, or crashes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please report security problems privately (see SECURITY.md), not here.
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: dartrosa 0.1.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: If JavaRosa or ODK Collect behaves differently, say how.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Attach or paste the smallest XForm (XML) that shows the problem, and the code you ran.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Flutter 3.x on Android 14 / Dart VM / Chrome (dart2js or dart2wasm)
