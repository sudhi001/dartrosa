name: dartrosa_flutter
description: >-
  Flutter renderer for DartRosa: shows ODK XForms as Material widgets, in a
  Collect-like pager or a single scrolling page.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.35.0"

dependencies:
  dartrosa:
    path: ../dartrosa
  dartrosa_external_data:
    path: ../dartrosa_external_data
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  intl: ^0.20.2
  path_parsing: ^1.1.0
  xml: ^6.6.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# dartrosa_external_data names dartrosa as a workspace sibling (`any`).
dependency_overrides:
  dartrosa:
    path: ../dartrosa
