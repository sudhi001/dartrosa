name: dartrosa_flutter
description: >-
  Flutter renderer for DartRosa: shows ODK XForms as Material widgets, in a Collect-like pager or a single scrolling page.
version: 0.0.1
# Until the sibling packages are on pub.dev this package uses path
# dependencies, which pub.dev rejects; remove this line when they are
# replaced with version constraints (see the root README, "Publishing").
publish_to: none
homepage: https://github.com/sudhi001/dartrosa
repository: https://github.com/sudhi001/dartrosa/tree/main/packages/dartrosa_flutter
issue_tracker: https://github.com/sudhi001/dartrosa/issues
topics:
  - odk
  - xforms
  - forms
  - data-collection
  - widget

environment:
  sdk: ^3.10.0
  flutter: ">=3.35.0"

dependencies:
  dartrosa:
    path: ../dartrosa
  dartrosa_calendars:
    path: ../dartrosa_calendars
  dartrosa_external_data:
    path: ../dartrosa_external_data
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  intl: ^0.20.2
  path_parsing: ^1.1.0
  xml: ^6.6.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: ^3.0.10

# The DartRosa packages name their siblings by version (for pub.dev);
# use the local checkouts.
dependency_overrides:
  dartrosa:
    path: ../dartrosa
  dartrosa_calendars:
    path: ../dartrosa_calendars
  dartrosa_external_data:
    path: ../dartrosa_external_data
