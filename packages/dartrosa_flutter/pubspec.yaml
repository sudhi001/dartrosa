name: dartrosa_flutter
description: >-
  Flutter renderer for DartRosa: shows ODK XForms as Material widgets, in a
  Collect-like pager or a single scrolling page.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.35.0"

dependencies:
  dartrosa:
    path: ../dartrosa
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
