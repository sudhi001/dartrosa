name: dartrosa_openrosa
description: >-
  OpenRosa server client for DartRosa: form lists, manifests, form and media
  downloads, entity integrity checks and multipart submission upload. A port
  of ODK Collect's open-rosa module and its OpenRosa instance uploader.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  clock: ^1.1.0
  collection: ^1.19.0
  crypto: ^3.0.0
  dartrosa: any
  dartrosa_encryption: any
  http: ^1.2.0
  logging: ^1.2.0
  meta: ^1.16.0
  mime: ^2.0.0
  xml: ">=6.5.0 <8.0.0"

dev_dependencies:
  test: ^1.25.0
