  dartrosa_encryption: ^0.0.1
  http: ^1.2.0
  logging: ^1.2.0
  meta: ^1.16.0
  mime: ^2.0.0
  xml: ">=6.5.0 <8.0.0"

dev_dependencies:
  test: ^1.25.0
