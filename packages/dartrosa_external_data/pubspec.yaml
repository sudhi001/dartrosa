name: dartrosa_external_data
description: >-
  ODK Collect's external data ("dynamic preload") for DartRosa: pulldata()
  and search() appearances over CSV form media. A port of Collect's
  dynamicpreload package.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  collection: ^1.19.0
  crypto: ^3.0.0
  dartrosa: any
  logging: ^1.2.0

dev_dependencies:
  test: ^1.25.0
